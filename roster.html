{% extends 'base.html' %}{% block content %}<p class="eyebrow">TEAM</p><h1>Player roster</h1><section class="panel"><h2>Add player</h2><form class="form-grid" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label>Player name<input name="name" required maxlength="120"></label><label>Jersey #<input name="jersey" maxlength="12"></label><label>Position<input name="position" maxlength="35" placeholder="LB"></label><button>Add player</button></form></section><section class="panel"><h2>{{players|length}} Players</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Position</th></tr></thead><tbody>{% for p in players %}<tr><td>{{p.jersey}}</td><td>{{p.name}}</td><td>{{p.position}}</td></tr>{% else %}<tr><td colspan="3">No players yet.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
