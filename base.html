<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klear IQ · Football Performance Grading</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<header><a class="brand" href="{{url_for('home')}}"><span>KLEAR</span><b>IQ</b><small>FOOTBALL GRADING</small></a>{% if session.get('authenticated') %}<nav><a href="{{url_for('home')}}">Game weeks</a><a href="{{url_for('roster')}}">Roster</a><a href="{{url_for('season')}}">Season report</a><form method="post" action="{{url_for('logout')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="subtle">Log out</button></form></nav>{% endif %}</header>
<main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{category}}" role="status">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>KLEAR IQ · Every rep. Every grade. Every game.</footer></body></html>
